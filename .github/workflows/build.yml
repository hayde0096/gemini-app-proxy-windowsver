name: Build & Release (Windows x64)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Package Artifacts & Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/pkg | Out-Null
          Copy-Item build\Release\version.dll dist\version.dll
          Copy-Item build\Release\version.dll dist\pkg\version.dll
          Copy-Item config\gemini-proxy.ini.example dist\pkg\gemini-proxy.ini.example
          Copy-Item scripts\gemini-proxy.ps1 dist\pkg\gemini-proxy.ps1
          Copy-Item README.md dist\pkg\README.md
          Copy-Item LICENSE dist\pkg\LICENSE

          Compress-Archive -Path dist\pkg\* -DestinationPath dist\gemini-app-proxy-win-x64.zip -Force

          $hashes = @(
            Get-FileHash dist\version.dll -Algorithm SHA256
            Get-FileHash dist\gemini-app-proxy-win-x64.zip -Algorithm SHA256
          ) | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)"
          }
          Set-Content -Path dist\SHA256SUMS.txt -Value $hashes -Encoding ASCII

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-app-proxy-win-x64
          path: |
            dist/version.dll
            dist/gemini-app-proxy-win-x64.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/version.dll
            dist/gemini-app-proxy-win-x64.zip
            dist/SHA256SUMS.txt
